<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="440" viewBox="0 0 1020 440" role="img" aria-labelledby="title desc">
<title id="title">When does an optimal TSP completion become unreachable?</title>
<desc id="desc">A recorded Jev-1.13.0 twelve-city episode. The exact optimum is 192. Step 2 raises the best reachable tour length to 194. Final length is 216; gap is 24. Steps 4 and 8 through 10 are locally optimal but cannot undo earlier loss.</desc>
<rect width="1020" height="440" rx="12" fill="#faf9f6"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172c35">
<text x="28" y="37" font-size="24" font-weight="bold">A legal choice can eliminate every optimal completion</text>
<text x="28" y="64" font-size="14">Recorded Jev-1.13.0 trajectory · 12 cities · Manhattan TSP · lower tour length is better</text>
<text x="28" y="96" font-size="13">Best reachable full-tour length, conditional on the choices already made</text>
<line x1="85" x2="938" y1="300.0" y2="300.0" stroke="#d9e1dd"/>
<text x="70" y="304.0" text-anchor="end" font-size="13">192</text>
<line x1="85" x2="938" y1="256.0" y2="256.0" stroke="#d9e1dd"/>
<text x="70" y="260.0" text-anchor="end" font-size="13">200</text>
<line x1="85" x2="938" y1="212.0" y2="212.0" stroke="#d9e1dd"/>
<text x="70" y="216.0" text-anchor="end" font-size="13">208</text>
<line x1="85" x2="938" y1="168.0" y2="168.0" stroke="#d9e1dd"/>
<text x="70" y="172.0" text-anchor="end" font-size="13">216</text>
<polyline points="90,300.0 173,300.0 256,289.0 339,256.0 422,256.0 505,223.0 588,201.0 671,168.0 754,168.0 837,168.0 920,168.0" fill="none" stroke="#237d6f" stroke-width="3"/>
<circle cx="90" cy="300.0" r="5" fill="#237d6f"/>
<text x="90" y="326" text-anchor="middle" font-size="13">0</text>
<circle cx="173" cy="300.0" r="5" fill="#237d6f"/>
<text x="173" y="326" text-anchor="middle" font-size="13">1</text>
<circle cx="256" cy="289.0" r="5" fill="#b44d36"/>
<text x="256" y="326" text-anchor="middle" font-size="13">2</text>
<text x="256" y="277.0" text-anchor="middle" font-size="13" fill="#a33c28">+2</text>
<circle cx="339" cy="256.0" r="5" fill="#b44d36"/>
<text x="339" y="326" text-anchor="middle" font-size="13">3</text>
<text x="339" y="244.0" text-anchor="middle" font-size="13" fill="#a33c28">+6</text>
<circle cx="422" cy="256.0" r="5" fill="#237d6f"/>
<text x="422" y="326" text-anchor="middle" font-size="13">4</text>
<circle cx="505" cy="223.0" r="5" fill="#b44d36"/>
<text x="505" y="326" text-anchor="middle" font-size="13">5</text>
<text x="505" y="211.0" text-anchor="middle" font-size="13" fill="#a33c28">+6</text>
<circle cx="588" cy="201.0" r="5" fill="#b44d36"/>
<text x="588" y="326" text-anchor="middle" font-size="13">6</text>
<text x="588" y="189.0" text-anchor="middle" font-size="13" fill="#a33c28">+4</text>
<circle cx="671" cy="168.0" r="5" fill="#b44d36"/>
<text x="671" y="326" text-anchor="middle" font-size="13">7</text>
<text x="671" y="156.0" text-anchor="middle" font-size="13" fill="#a33c28">+6</text>
<circle cx="754" cy="168.0" r="5" fill="#237d6f"/>
<text x="754" y="326" text-anchor="middle" font-size="13">8</text>
<circle cx="837" cy="168.0" r="5" fill="#237d6f"/>
<text x="837" y="326" text-anchor="middle" font-size="13">9</text>
<circle cx="920" cy="168.0" r="5" fill="#237d6f"/>
<text x="920" y="326" text-anchor="middle" font-size="13">10</text>
<text x="500" y="350" text-anchor="middle" font-size="13">Recorded decision step (0 = before the first choice)</text>
<text x="90" y="385" font-size="15" font-weight="bold">First irreversible loss: step 2</text>
<text x="515" y="385" font-size="15" font-weight="bold">Sum of step losses = 24 = final objective gap</text>
<text x="28" y="418" font-size="12">s-71b3029836cedd68be8ba69981a17724 · retrospective diagnostic; no oracle guidance · one example, not a ranking</text>
