<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="358" viewBox="0 0 1080 358" role="img" aria-labelledby="title desc">
  <title id="title">From bounded graph decisions to exact trajectory diagnosis</title>
  <desc id="desc">A schematic, not an experimental trace. Models receive a public graph state and legal actions. Deterministic transitions follow their actual choices. An offline evaluator separately measures correctness, completion, solution gap and irreversible loss. Private oracle values never enter model requests.</desc>
  <rect width="1080" height="358" rx="12" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172c35">
    <text x="28" y="36" font-size="24" font-weight="bold">One interface. Three distinct evaluation questions.</text>
    <text x="28" y="63" font-size="14">Is the answer correct? Does the episode finish? How good is the completed solution?</text>
    <g fill="#edf4f0" stroke="#8fc7b7">
      <rect x="28" y="90" width="240" height="120" rx="8"/>
      <rect x="292" y="90" width="230" height="120" rx="8"/>
      <rect x="546" y="90" width="230" height="120" rx="8"/>
      <rect x="800" y="90" width="252" height="120" rx="8"/>
    </g>
    <g font-size="17" font-weight="bold">
      <text x="46" y="120">1. Public graph state</text>
      <text x="310" y="120">2. Bounded choice</text>
      <text x="564" y="120">3. Actual trajectory</text>
      <text x="818" y="120">4. Offline verification</text>
    </g>
    <g font-size="14">
      <text x="46" y="148">Graph + question + actions</text>
      <text x="46" y="174">No labels or oracle guidance</text>
      <text x="310" y="148">Native / grammar / scoring</text>
      <text x="310" y="174">No answer repair or retries</text>
      <text x="564" y="148">Apply the selected action</text>
      <text x="564" y="174">Keep failures and prefixes</text>
      <text x="818" y="148">Truth + exact optimal objective</text>
      <text x="818" y="174">Quality and coverage separately</text>
    </g>
    <g stroke="#237d6f" stroke-width="2" fill="none">
      <path d="M270 152h18m-5-5 5 5-5 5"/>
      <path d="M524 152h18m-5-5 5 5-5 5"/>
      <path d="M778 152h18m-5-5 5 5-5 5"/>
      <path d="M658 212v18H150v-15m-5 5 5-5 5 5"/>
    </g>
    <text x="340" y="250" font-size="13">Next public state follows the model's own previous choices</text>
    <rect x="28" y="272" width="1024" height="60" rx="8" fill="#e0ebe6"/>
    <text x="46" y="296" font-size="15" font-weight="bold">Exact continuation analysis: when does the global optimum become unreachable?</text>
    <text x="46" y="318" font-size="13">Offline only. For complete trajectories, incremental irreversible losses sum to the final objective gap.</text>
  </g>
</svg>
