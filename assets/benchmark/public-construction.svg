<title id="title">GraphDecide public-instance solution quality</title>
<desc id="desc">Mean directional percentage gaps and feasible/scheduled coverage. Each task has its own color scale. MaxCut uses historical source-reported best-known references, not proven optima. Full values are in the README and CSV.</desc>
