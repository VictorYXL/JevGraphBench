# Expanded evaluation of the two current tasks, not all graph algorithms.
# Running this configuration directly makes live Jev calls and may incur charges.
# Keep this seed/config fixed after inspecting model results.
schema_version: 1

run:
  seed: 20260924                # Separate from the smoke/pilot seed; not a disjoint split.
  repetitions: 1              # Spend the budget on more graphs, not repeated answers.
  max_calls: 4800              # 4 sources * 3 sizes * 20 graphs * 20 questions.
  output_dir: "../results/comprehensive-v1"

data:
  datasets: ["facebook", "ca-grqc", "power", "human-ppi"]
  data_dir: "../data/real"

sampling:
  method: "connected_frontier"
  node_counts: [32, 64, 128]
  samples_per_size: 20
  max_attempts: 100

tasks:
  adjacency_questions: 4                   # Two positive and two negative pairs.
  distance_questions_per_threshold: 4      # Same balanced quota for every threshold.
  distance_thresholds: [2, 3, 4, 6]        # Boundary pairs at distances k and k+1.

model:
  provider: "typesafe"
  model: "jev-1.13.0"           # Version returned by the user's successful smoke run.
  timeout_seconds: 30.0