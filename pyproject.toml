[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevgraphbench"
version = "0.1.0"
description = "Graph decision benchmarking clients for Jev and Jev-like models"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false